spring:
  application:
    name: personal-note-k

  datasource:
    url: jdbc:postgresql://trantuantu.de:5432/personal_note_k
    username: postgres
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none  # Liquibase übernimmt das Schema-Management
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  security:
    # Basic Auth User (nur noch für Swagger)
    user:
      name: ${SWAGGER_USER:admin}
      password: ${SWAGGER_PASSWORD:testtest}
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.trantuantu.de/realms/personal-note

logging:
  level:
    org.springframework.boot.autoconfigure: INFO
    liquibase: INFO

keycloak:
  realm: personal-note
  auth-server-url: https://keycloak.trantuantu.de

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /public
  endpoint:
    health:
      show-details: always